<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside
    class="flex flex-col bg-slate-900 text-white transition-all duration-300"
    [class.w-64]="sidenavOpened()"
    [class.w-16]="!sidenavOpened()"
  >
    <!-- Sidebar Header -->
    <div class="flex items-center h-16 px-4 border-b border-slate-700">
      <mat-icon class="text-blue-400 mr-2">local_hospital</mat-icon>
      @if (sidenavOpened()) {
        <span class="font-semibold text-lg whitespace-nowrap">Privatna Klinika</span>
      }
    </div>

    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto py-2">
      @for (group of navGroups; track group.title) {
        @if (sidenavOpened()) {
          <div class="px-4 pt-4 pb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">
            {{ group.title }}
          </div>
        }
        @for (item of group.items; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-slate-700/60 text-blue-400"
            class="flex items-center gap-3 px-4 py-2.5 text-slate-300 hover:bg-slate-800 hover:text-white transition-colors cursor-pointer no-underline"
            [class.justify-center]="!sidenavOpened()"
            [matTooltip]="!sidenavOpened() ? item.label : ''"
            matTooltipPosition="right"
          >
            <mat-icon class="text-xl">{{ item.icon }}</mat-icon>
            @if (sidenavOpened()) {
              <span class="text-sm whitespace-nowrap">{{ item.label }}</span>
            }
          </a>
        }
      }
    </nav>

    <!-- Sidebar Footer -->
    <div class="border-t border-slate-700 p-2">
      <button
        mat-icon-button
        (click)="toggleSidenav()"
        class="text-slate-400 hover:text-white w-full"
      >
        <mat-icon>{{ sidenavOpened() ? 'chevron_left' : 'chevron_right' }}</mat-icon>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex flex-col flex-1 overflow-hidden">
    <!-- Top Header -->
    <header class="flex items-center justify-between h-16 px-6 bg-white border-b border-slate-200 shadow-sm">
      <div class="flex items-center gap-2">
        <button mat-icon-button (click)="toggleSidenav()">
          <mat-icon>menu</mat-icon>
        </button>
        <h1 class="text-lg font-medium text-slate-800 m-0">IS Privatne Klinike</h1>
      </div>

      <div class="flex items-center gap-2">
        <button mat-icon-button [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item disabled>
            <mat-icon>person</mat-icon>
            <span>Korisnik</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Odjavi se</span>
          </button>
        </mat-menu>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto bg-slate-50 p-6">
      <router-outlet />
    </main>
  </div>
</div>
