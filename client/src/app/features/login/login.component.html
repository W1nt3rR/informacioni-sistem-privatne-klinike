<div class="min-h-screen flex items-center justify-center bg-base-200">
  <div class="card bg-base-100 shadow-xl w-full max-w-md">
    <div class="card-body">
      <div class="text-center mb-6">
        <span class="material-icons text-primary mb-2 text-5xl">local_hospital</span>
        <h1 class="text-2xl font-bold m-0">IS Privatne Klinike</h1>
        <p class="text-base-content/60 mt-1">Prijavite se na sistem</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <label class="input w-full">
          <span class="material-icons text-base">person</span>
          <input type="text" placeholder="Korisničko ime" [(ngModel)]="userName" name="userName" required autocomplete="username" />
        </label>

        <label class="input w-full">
          <span class="material-icons text-base">lock</span>
          <input [type]="hidePassword() ? 'password' : 'text'" placeholder="Lozinka" [(ngModel)]="password" name="password" required autocomplete="current-password" />
          <button type="button" class="btn btn-ghost btn-xs btn-square" (click)="hidePassword.update(v => !v)">
            <span class="material-icons text-base">{{ hidePassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </label>

        @if (errorMessage()) {
          <div class="alert alert-error text-sm">
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <button class="btn btn-primary w-full" type="submit" [disabled]="loading() || !userName || !password">
          @if (loading()) {
            <span class="loading loading-spinner loading-sm"></span>
          } @else {
            Prijavi se
          }
        </button>
      </form>

      <div class="text-center mt-4">
        <a routerLink="/register" class="link link-primary text-sm">
          Nemate nalog? Registrujte se kao pacijent
        </a>
      </div>
    </div>
  </div>
</div>
